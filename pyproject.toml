[project]
name = "package-name"
version = "0.1.0"
description = "Package description"
authors = [{name = "Author Name", email = "author@example.com"}]
readme = "README.md"
license = {text = "ISC"}
requires-python = ">=3.10"
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/opencitations/python-package-template"
Documentation = "https://opencitations.github.io/python-package-template/"
Repository = "https://github.com/opencitations/python-package-template"

[dependency-groups]
dev = [
    "genbadge[coverage]>=1.1.3",
    "jupyter-book~=1.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "reuse>=6.2.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"
